<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- mobile-shell: home-screen / standalone support (Harry-Owner patch, re-applied after each sync) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聖教序習字">
<meta name="application-name" content="聖教序習字">
<meta name="theme-color" content="#f4efe5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon/icon-192.png">
<script>(function(){var m=document.querySelector('meta[name=theme-color]'),c={day:'#f4efe5',night:'#141210'},h=document.documentElement,f=function(){m.content=c[h.dataset.theme]||c.day};f();new MutationObserver(f).observe(h,{attributes:true,attributeFilter:['data-theme']})})();</script>
<!-- /mobile-shell -->
<title>圣教序习字 · 十八法课程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;900&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app2/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data/boxes.js"></script>
<script src="data/content.js"></script>
<script src="data/dict2.js"></script>
<script src="data/zhuzi.js"></script>
<script src="data/laws.js"></script>
<script src="data/videos.js"></script>
<script src="data/duidu.js"></script>
<script src="data/jinglin.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="app2/core.jsx"></script>
<script type="text/babel" src="app2/jinglin.jsx"></script>
<script type="text/babel" src="app2/course.jsx"></script>
<script type="text/babel" src="app2/tie.jsx"></script>
<script type="text/babel">
const TABS = [['course', '课程', 'course'], ['read', '读文', 'read'], ['tie', '字帖', 'tie'], ['me', '我的', 'me']];
function App() {
  const [s, update] = useStore2();
  const [route, setRoute] = React.useState(() => { try { return JSON.parse(localStorage.getItem('sjx2-route')) || { tab: 'course' }; } catch (e) { return { tab: 'course' }; } });
  const [char, setChar] = React.useState(null);
  React.useEffect(() => { localStorage.setItem('sjx2-route', JSON.stringify(route)); }, [route]);
  React.useEffect(() => { document.documentElement.dataset.theme = s.settings.theme; }, [s.settings.theme]);
  const openLesson = n => { setRoute({ tab: 'course', lesson: n }); window.scrollTo(0, 0); };
  const openChar = (c, i) => setChar({ c, i });
  const openJL = k => { setRoute({ tab: 'course', jl: k }); window.scrollTo(0, 0); };
  const goRead = n => { setRoute({ tab: 'read', focus: n }); };
  const goTie = p => { localStorage.setItem('sjx2-page', p); setRoute({ tab: 'tie' }); window.scrollTo(0, 0); };
  const home = () => setRoute({ tab: 'course' });
  const script = s.settings.script;
  return (
    <ScriptCtx.Provider value={script}>
      <header className="top"><div className="top-in">
        <div className="brand"><Seal size={34}>集王</Seal>聖教序習字</div>
        <nav className="tabs">{TABS.map(([k, l, ic]) => <button key={k} className={'tab ' + (route.tab === k ? 'on' : '')} onClick={() => { setRoute({ tab: k }); window.scrollTo(0, 0); }}><Icon name={ic} size={18} />{l}</button>)}</nav>
        <div className="togs">
          <button className="tog" title="繁 / 简" onClick={() => update(n => { n.settings.script = script === 'trad' ? 'simp' : 'trad'; })}>{script === 'trad' ? '繁' : '简'}</button>
          <button className="tog" title="日间 / 夜间" onClick={() => update(n => { n.settings.theme = n.settings.theme === 'day' ? 'night' : 'day'; })}><Icon name={s.settings.theme === 'day' ? 'sun' : 'moon'} size={17} /></button>
        </div>
      </div></header>
      <main className="main" data-screen-label={route.tab + (route.lesson != null ? '-' + route.lesson : '')}>
        {route.tab === 'course' && route.lesson == null && route.jl == null && <CourseHome s={s} openLesson={openLesson} openJL={openJL} />}
        {route.tab === 'course' && route.lesson != null && <LessonPage n={route.lesson} s={s} update={update} back={home} openChar={openChar} openLesson={openLesson} />}
        {route.tab === 'course' && route.jl === 'home' && <JinglinHome s={s} back={home} openJL={openJL} />}
        {route.tab === 'course' && typeof route.jl === 'number' && <JinglinDay k={route.jl} s={s} update={update} back={home} openJL={openJL} openChar={openChar} goRead={goRead} />}
        {route.tab === 'read' && <ReadPage s={s} openChar={openChar} focus={route.focus} goTie={goTie} />}
        {route.tab === 'tie' && <TiePage openChar={openChar} />}
        {route.tab === 'me' && <MePage s={s} update={update} openLesson={openLesson} />}
      </main>
      {char && <CharDrawer c={char.c} boxIdx={char.i} onClose={() => setChar(null)} openChar={openChar} openLesson={n => { setChar(null); openLesson(n); }} openJL={k => { setChar(null); openJL(k); }} goRead={n => { setChar(null); goRead(n); }} />}
    </ScriptCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
